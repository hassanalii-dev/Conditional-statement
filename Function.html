        function calculateBMI(weight,height){
        let BMI=weight/(height**2)
        console.log(BMI)
        }
        calculateBMI(50,1.75)
        calculateBMI(60,1.5)
        calculateBMI(70,1.56)

        function CalculatePercentage(ObtMarks,TotalMarks){
        let Percentage=(ObtMarks/TotalMarks)*100
        return Percentage
        }
        let per=CalculatePercentage(858,1200)
        if(per>50){
            console.log("Good")
        }else{
            console.log("Not Good")
        }
        function calculateCI(p,r,n,t){
            let amount=p*(1+r/n)**(n*t)
            return amount
        }
        let amount=calculateCI(10000,0.05,1,6)
        console.log(amount)
    </script>
